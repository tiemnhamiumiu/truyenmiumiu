<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Truyện Mới Miu Miu</title>

  <link
    rel="stylesheet"
    href="style.css?v=13"
  >
<link rel="icon" type="image/png" href="codetruyen/icon.jpg">
</head>

<body>


<!-- ==================================================
     TOP MENU
================================================== -->

<header class="menu">

  <a href="index.html">
    Trang chủ
  </a>

  <a href="ngontinh.html">
    Ngôn tình
  </a>

  <a href="dammy.html">
    Đam mỹ
  </a>

    <a href="cotrang.html">Cổ trang</a>
  <a href="https://truyenxoithitmiumiu.nekoweb.org/" id="xoiThitLink">Xôi Thịt</a>

</header>


<!-- ==================================================
     TITLE
================================================== -->

<h1 style="
  text-align:center;
  color:#ff5722;
">
  TRUYỆN MỚI
</h1>


<!-- ==================================================
     SEARCH
================================================== -->

<div class="search-box">

  <input
    type="text"
    id="search"
    placeholder="🔍 Tìm Tên Hoặc Số Truyện"
    autocomplete="off"
  >

</div>


<!-- ==================================================
     LIST
================================================== -->

<div
  class="container"
  id="list"
></div>


<!-- ==================================================
     DATA
================================================== -->

<script src="data.js"></script>

<!-- ==================================================
     SCRIPT VIEW
================================================== -->

<script src="script.js"></script>


<script>


/* ==================================================
   ELEMENTS
================================================== */

const list =
  document.getElementById("list");

const search =
  document.getElementById("search");


/* ==================================================
   CHUẨN HÓA TỪ KHÓA
================================================== */

function normalizeText(str) {

  return String(str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toLowerCase()
    .trim();

}


/* ==================================================
   TẠO SEARCH TITLE
================================================== */

stories.forEach(
  item => {

    if (!item) {
      return;
    }

    item.searchTitle =
      normalizeText(
        item.title
      );

  }
);


/* ==================================================
   RENDER TỪNG ĐỢT

   Thay vì vẽ 1102 truyện cùng lúc, chỉ vẽ
   PAGE_SIZE truyện đầu. Cuộn xuống gần cuối
   thì tự vẽ thêm đợt tiếp theo.
================================================== */

const PAGE_SIZE = 40;

let currentData = [];
let shown = 0;


/* ---------- 1 thẻ truyện ---------- */

function makeCard(item) {

  return `

    <a
      class="book"
      href="detail.html?id=${item.id}"
    >

      <!-- ẢNH -->

      <img
        src="${item.image}"
        alt="${item.title}"
        loading="lazy"
        decoding="async"
      >


      <!-- LƯỢT XEM -->

      <div class="view-count"></div>


      <!-- TÊN TRUYỆN -->

      <h2>${item.title}</h2>

    </a>

  `;

}


/* ---------- Vẽ thêm 1 đợt ---------- */

function renderMore() {

  const next =
    currentData.slice(
      shown,
      shown + PAGE_SIZE
    );

  if (!next.length) {
    return;
  }

  /* Gắn HTML vào trang 1 lần cho cả đợt */

  list.insertAdjacentHTML(
    "beforeend",
    next.map(makeCard).join("")
  );

  shown += next.length;


  /* Cập nhật view (chỉ đọc, không tự cộng) */

  if (
    typeof loadViewCounts ===
    "function"
  ) {

    loadViewCounts();

  }


  /* Nếu màn hình còn trống thì vẽ tiếp */

  requestAnimationFrame(fillViewport);

}


/* ---------- Còn trống màn hình → vẽ tiếp ---------- */

function fillViewport() {

  if (shown >= currentData.length) {
    return;
  }

  if (
    sentinel.getBoundingClientRect().top <
    window.innerHeight + 800
  ) {

    renderMore();

  }

}


/* ---------- Vẽ lại từ đầu với 1 danh sách ---------- */

function render(data) {

  currentData =
    data
      .filter(Boolean)
      .sort(
        (a, b) =>
          b.id - a.id
      );

  shown = 0;

  list.innerHTML = "";

  renderMore();

}


/* ==================================================
   CUỘN GẦN CUỐI → VẼ THÊM
================================================== */

const sentinel =
  document.createElement("div");

sentinel.style.height = "1px";

list.after(sentinel);


new IntersectionObserver(
  entries => {

    if (entries[0].isIntersecting) {
      renderMore();
    }

  },
  {
    rootMargin: "800px"
  }
).observe(sentinel);


/* ==================================================
   LOAD BAN ĐẦU
================================================== */

render(
  stories
);


/* ==================================================
   TÌM KIẾM THEO:

   1. TÊN TRUYỆN
   2. ID TRUYỆN

   Tìm trên toàn bộ danh sách, kết quả
   cũng hiện theo từng đợt.
================================================== */

let searchTimer;

search.addEventListener(
  "input",
  function () {

    clearTimeout(searchTimer);

    searchTimer = setTimeout(
      () => {

        const value =
          normalizeText(
            this.value
          );


        /* Ô tìm kiếm trống */

        if (!value) {

          render(
            stories
          );

          return;

        }


        /* Lọc theo tên hoặc ID */

        const filtered =
          stories.filter(
            item =>
              item &&
              (
                item.searchTitle
                  .includes(value) ||
                String(item.id)
                  .toLowerCase()
                  .includes(value)
              )
          );

        render(
          filtered
        );

      },
      200
    );

  }
);


/* ==================================================
   ENTER
================================================== */

search.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      this.blur();

    }

  }
);


</script>



<!-- ==================================================
     POPUP CHUYỂN SANG WEB XÔI THỊT
================================================== -->

<div
  id="xoiThitPopup"
  class="xoi-thit-overlay"
  style="display:none;"
>

  <div class="xoi-thit-box">

      <img
    src="codetruyen/icon.jpg"
    alt="Truyện Mới Miu Miu"
    class="xoi-thit-icon"
  >

  <span class="xoi-thit-arrow">→</span>

  <img
    src="codetruyen/iconxoi.jpg"
    alt="Xôi Thịt Nhà Mui Miu"
    class="xoi-thit-icon"
  >

    <div class="xoi-thit-text">
      Bạn đang chuyển qua web
      <strong>Xôi Thịt Nhà Mui Miu</strong>
    </div>

    <div class="xoi-thit-question">
      Bạn có muốn tiếp tục không?
    </div>

    <div class="xoi-thit-buttons">

      <button
        id="xoiThitYes"
        class="xoi-thit-yes"
      >
        Có
      </button>

      <button
        id="xoiThitNo"
        class="xoi-thit-no"
      >
        Không
      </button>

    </div>

  </div>

</div>


<!-- ==================================================
     POPUP SCRIPT
================================================== -->

<script>

const xoiThitLink =
  document.getElementById("xoiThitLink");

const xoiThitPopup =
  document.getElementById("xoiThitPopup");

const xoiThitYes =
  document.getElementById("xoiThitYes");

const xoiThitNo =
  document.getElementById("xoiThitNo");


/* ==================================================
   ẤN XÔI THỊT
================================================== */

xoiThitLink.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    xoiThitPopup.style.display = "flex";

  }
);


/* ==================================================
   CÓ → CHUYỂN WEB
================================================== */

xoiThitYes.addEventListener(
  "click",
  function() {

    window.location.href =
      "https://truyenxoithitmiumiu.nekoweb.org/";

  }
);


/* ==================================================
   KHÔNG → ĐÓNG BẢNG
================================================== */

xoiThitNo.addEventListener(
  "click",
  function() {

    xoiThitPopup.style.display = "none";

  }
);


/* ==================================================
   ẤN RA NGOÀI BẢNG → ĐÓNG
================================================== */

xoiThitPopup.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      xoiThitPopup
    ) {

      xoiThitPopup.style.display = "none";

    }

  }
);

</script>
</body>
</html>
