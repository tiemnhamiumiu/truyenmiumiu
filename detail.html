<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tiệm Nhà Miu Miu</title>

  <link
    rel="stylesheet"
    href="style.css?v=3"
  >
<link rel="icon" type="image/png" href="codetruyen/icon.jpg">

  <style>

    /* ==================================================
       GIẢM KHOẢNG CÁCH GIỮA TYPE → VIEW
    ================================================== */

    .tag {
      margin:
        15px 0 5px;
    }


    /* ==================================================
       LƯỢT XEM
    ================================================== */

    .detail-view-count {
      margin:
        0 0 10px;

      color:#8f8f8f;

      font-size:13px;

      line-height:1.4;

      text-align:left;
    }

    .detail-view-count span {
      color:#a0a0a0;

      font-weight:normal;
    }


    /* ==================================================
       VĂN ÁN
    ================================================== */

    .desc {
      margin-top:0;

      color:#ddd;

      line-height:1.9;

      white-space:pre-line;

      max-height:220px;

      overflow-y:auto;

      padding-right:10px;
    }

  </style>

</head>


<body>


<!-- ==================================================
     TOPBAR
================================================== -->

<div class="topbar">

  <a href="index.html">
    Trang chủ
  </a>

  <a href="ngontinh.html">
    Ngôn tình
  </a>

  <a href="dammy.html">
    Đam mỹ
  </a>

    <a href="cotrang.html">Cổ trang</a>
  <a href="https://tiemnhamiumiu.neocities.org/" id="xoiThitLink">Xôi Thịt</a>

</div>


<!-- ==================================================
     DETAIL
================================================== -->

<div
  class="detail-page"
  id="detail"
></div>


<!-- ==================================================
     DATA
================================================== -->

<script src="data.js?v=2"></script>

<script src="script.js"></script>


<script>

const params =
  new URLSearchParams(
    location.search
  );


const id =
  params.get("id");


const story =
  stories.find(
    item =>
      item &&
      item.id == id
  );


const detail =
  document.getElementById(
    "detail"
  );


/* ==================================================
   KHÔNG TÌM THẤY TRUYỆN
================================================== */

if (!story) {

  document.title =
    "Không tìm thấy truyện - Tiệm Nhà Miu Miu";

  detail.innerHTML = `

    <div style="
      text-align:center;
      padding:100px 20px;
      color:white;
    ">

      <h1>
        ❌ Không tìm thấy truyện
      </h1>

    </div>

  `;

}


/* ==================================================
   CÓ TRUYỆN
================================================== */

else {


  /* ==================================================
     TÊN THỂ LOẠI
  ================================================== */

  let typeName =
    "Ngôn tình";


  if (
    story.type ===
    "dammy"
  ) {

    typeName =
      "Đam mỹ";

  }


  if (
    story.type ===
    "cotrang"
  ) {

    typeName =
      "Cổ trang";

  }


  /* ==================================================
     LINK THỂ LOẠI
  ================================================== */

  let typeLink =
    "ngontinh.html";


  if (
    story.type ===
    "dammy"
  ) {

    typeLink =
      "dammy.html";

  }


  if (
    story.type ===
    "cotrang"
  ) {

    typeLink =
      "cotrang.html";

  }


  /* ==================================================
     VĂN ÁN
     
     trim() để loại bỏ khoảng trắng /
     xuống dòng thừa đầu và cuối.
  ================================================== */

  const storyDesc =
    story.desc
      ? String(story.desc).trim()
      : "Chưa có văn án";


  /* ==================================================
     ĐỔI TITLE TAB THEO TÊN TRUYỆN (LỌC THEO ID)
  ================================================== */

  document.title =
    story.title + " - Tiệm Nhà Miu Miu";


  /* ==================================================
     HTML DETAIL
  ================================================== */

  detail.innerHTML = `

    <div class="detail-card">


      <!-- ẢNH -->

      <img
        src="${story.image}"
        class="detail-img"
        alt="${story.title}"
      >


      <!-- INFO -->

      <div class="detail-info">


        <!-- TÊN TRUYỆN -->

        <h1>
          ${story.title}
        </h1>


        <!-- THỂ LOẠI -->

        <a
          class="tag"
          href="${typeLink}"
        >
          ${typeName}
        </a>


        <!-- LƯỢT XEM -->

        <div
          class="detail-view-count"
        >

          

        </div>


        <!-- VĂN ÁN -->

        <div class="desc">${storyDesc}</div>


        <!-- ĐỌC NGAY -->

        <a
          href="${story.link}"
          class="read-btn"
        >
          Xem ngay
        </a>


      </div>

    </div>

  `;


  /* ==================================================
     CHỈ HIỂN THỊ VIEW
     KHÔNG TÍNH VIEW Ở ĐÂY
  ================================================== */

  if (
    typeof loadViewCounts ===
    "function"
  ) {

    loadViewCounts();

  }

}

</script>



<!-- ==================================================
     POPUP CHUYỂN SANG WEB XÔI THỊT
================================================== -->

<div
  id="xoiThitPopup"
  class="xoi-thit-overlay"
  style="display:none;"
>

  <div class="xoi-thit-box">

      <img
    src="codetruyen/icon.jpg"
    alt="Truyện Mới Miu Miu"
    class="xoi-thit-icon"
  >

  <span class="xoi-thit-arrow">→</span>

  <img
    src="codetruyen/iconxoi.jpg"
    alt="Xôi Thịt Nhà Mui Miu"
    class="xoi-thit-icon"
  >

    <div class="xoi-thit-text">
      Bạn đang chuyển qua web
      <strong>Xôi Thịt Nhà Mui Miu</strong>
    </div>

    <div class="xoi-thit-question">
      Bạn có muốn tiếp tục không?
    </div>

    <div class="xoi-thit-buttons">

      <button
        id="xoiThitYes"
        class="xoi-thit-yes"
      >
        Có
      </button>

      <button
        id="xoiThitNo"
        class="xoi-thit-no"
      >
        Không
      </button>

    </div>

  </div>

</div>


<!-- ==================================================
     POPUP SCRIPT
================================================== -->

<script>

const xoiThitLink =
  document.getElementById("xoiThitLink");

const xoiThitPopup =
  document.getElementById("xoiThitPopup");

const xoiThitYes =
  document.getElementById("xoiThitYes");

const xoiThitNo =
  document.getElementById("xoiThitNo");


/* ==================================================
   ẤN XÔI THỊT
================================================== */

xoiThitLink.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    xoiThitPopup.style.display = "flex";

  }
);


/* ==================================================
   CÓ → CHUYỂN WEB
================================================== */

xoiThitYes.addEventListener(
  "click",
  function() {

    window.location.href =
      "https://tiemnhamiumiu.neocities.org/";

  }
);


/* ==================================================
   KHÔNG → ĐÓNG BẢNG
================================================== */

xoiThitNo.addEventListener(
  "click",
  function() {

    xoiThitPopup.style.display = "none";

  }
);


/* ==================================================
   ẤN RA NGOÀI BẢNG → ĐÓNG
================================================== */

xoiThitPopup.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      xoiThitPopup
    ) {

      xoiThitPopup.style.display = "none";

    }

  }
);


</script>
<script src="../codetruyen/script.js"></script>
<!-- ==================================================
     BẢNG YÊU CẦU MỞ BẰNG CHROME / SAFARI
     (khi đang mở trong trình duyệt Facebook / Messenger)
================================================== -->
<style>
  .movie-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.92);
  }
  .movie-popup-box {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    border-radius: 18px;
    background: #181818;
    border: 1px solid #2a2a2a;
    color: #eee;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  .movie-popup-icon { font-size: 52px; line-height: 1; }
  .movie-popup-title {
    margin: 12px 0 10px;
    font-size: 22px;
    font-weight: 700;
    color: #ff5a1f;
  }
  .movie-popup-text { font-size: 15px; line-height: 1.6; color: #ccc; }
  .movie-popup-steps {
    margin: 16px 0;
    padding: 12px 14px;
    border-radius: 12px;
    background: #101010;
    border: 1px solid #262626;
    font-size: 14px;
    line-height: 1.7;
    color: #bbb;
    text-align: left;
  }
  .movie-popup-buttons { display: flex; flex-direction: column; gap: 10px; }
  .movie-popup-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .movie-popup-btn.primary { background: #ff5a1f; color: #fff; }
  .movie-popup-btn.secondary { background: #262626; color: #ddd; }
</style>

<script>
(function () {
  "use strict";

  /* true = Android tự mở Chrome luôn, false = chỉ hiện bảng */
  const AUTO_OPEN_CHROME = true;

  const ua = navigator.userAgent || navigator.vendor || "";

  const isMessengerBrowser = /FB_IAB|FBAN|FBAV|Messenger|Orca-Android/i.test(ua);
  const isAndroid = /Android/i.test(ua);

  if (!isMessengerBrowser) return;

  function openInChrome() {
    const url = window.location;
    window.location.href =
      "intent://" + url.host + url.pathname + url.search +
      "#Intent;scheme=https;package=com.android.chrome;" +
      "S.browser_fallback_url=" + encodeURIComponent(url.href) +
      ";end";
  }

  function copyPageLink(button) {
    const url = window.location.href;

    const done = function () {
      button.textContent = "✓ Đã sao chép link";
      setTimeout(function () {
        button.textContent = "📋 Sao chép link";
      }, 2000);
    };

    const fallback = function () {
      try {
        const input = document.createElement("textarea");
        input.value = url;
        input.style.cssText = "position:fixed;left:-10000px;top:0;";
        document.body.appendChild(input);
        input.focus();
        input.select();
        document.execCommand("copy");
        input.remove();
        done();
      } catch (e) {
        alert("Không thể tự sao chép. Link:\n" + url);
      }
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  function showNotice() {
    if (document.getElementById("messengerNoticePopup")) return;

    const chromeButton = isAndroid
      ? '<button id="messengerChromeBtn" class="movie-popup-btn primary" type="button">🌐 Mở bằng Chrome</button>'
      : "";

    const copyClass = isAndroid ? "secondary" : "primary";

    const popup = document.createElement("div");
    popup.id = "messengerNoticePopup";
    popup.className = "movie-popup-overlay";

    popup.innerHTML = `
      <div class="movie-popup-box" role="dialog" aria-modal="true">
        <div class="movie-popup-icon">⚠️</div>
        <div class="movie-popup-title">Bạn đang mở bằng trình duyệt Facebook</div>
        <div class="movie-popup-text">
          Trình duyệt trong Facebook / Messenger <strong>không ghi nhận được quảng cáo Shopee</strong>,
          nên bạn sẽ không mở khóa được truyện.
          Hãy chuyển sang Chrome / Safari để xem bình thường.
        </div>
        <div class="movie-popup-steps">
          <b>Cách chuyển:</b><br>
          1. Bấm nút <b>⋯ (3 chấm)</b> ở góc trên bên phải<br>
          2. Chọn <b>"Mở trong trình duyệt"</b><br>
          &nbsp;&nbsp;&nbsp;(hoặc <b>"Mở bằng Chrome" / "Mở bằng Safari"</b>)
        </div>
        <div class="movie-popup-buttons">
          ${chromeButton}
          <button id="messengerCopyBtn" class="movie-popup-btn ${copyClass}" type="button">
            📋 Sao chép link
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(popup);

    const copyBtn = document.getElementById("messengerCopyBtn");
    const chromeBtn = document.getElementById("messengerChromeBtn");

    if (copyBtn) copyBtn.addEventListener("click", function () { copyPageLink(copyBtn); });
    if (chromeBtn) chromeBtn.addEventListener("click", openInChrome);
  }

  if (AUTO_OPEN_CHROME && isAndroid) openInChrome();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", showNotice);
  } else {
    showNotice();
  }
})();
</script>
</body>
</html>
