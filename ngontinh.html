const list =

/* ==================================================
   CẮT TÊN
================================================== */

function clampBookTitle(element) {

  const fullTitle =
    String(
      element.dataset.fullTitle || ""
    ).trim();


  if (!fullTitle) {

    element.textContent = "";

    return;

  }


  element.textContent =
    fullTitle;

  element.style.whiteSpace =
    "normal";

  element.style.overflow =
    "visible";

  element.style.height =
    "auto";

  element.style.maxHeight =
    "none";


  const style =
    window.getComputedStyle(
      element
    );


  const lineHeight =
    parseFloat(
      style.lineHeight
    ) || 21;


  const paddingTop =
    parseFloat(
      style.paddingTop
    ) || 0;


  const paddingBottom =
    parseFloat(
      style.paddingBottom
    ) || 0;


  const maxHeight =
    lineHeight * 2 +
    paddingTop +
    paddingBottom;


  if (
    element.scrollHeight <=
    maxHeight + 1
  ) {

    return;

  }


  const words =
    fullTitle.split(/\s+/);


  let bestText =
    "";


  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const candidate =
      words
        .slice(0, i + 1)
        .join(" ") +
      "...";


    element.textContent =
      candidate;


    if (
      element.scrollHeight <=
      maxHeight + 1
    ) {

      bestText =
        words
          .slice(0, i + 1)
          .join(" ");

    }
    else {

      break;

    }

  }


  if (!bestText) {

    bestText =
      words[0] || "";

  }


  element.textContent =
    bestText + "...";


  element.style.height =
    maxHeight + "px";

  element.style.maxHeight =
    maxHeight + "px";

  element.style.overflow =
    "hidden";

}


/* ==================================================
   TẤT CẢ TÊN
================================================== */

function clampAllBookTitles() {

  document
    .querySelectorAll(".book-title")
    .forEach(element => {

      clampBookTitle(element);

    });

}


/* ==================================================
   VIEW
================================================== */

function refreshViewCounts() {

  if (
    typeof loadViewCounts ===
    "function"
  ) {

    loadViewCounts();

  }

}


/* ==================================================
   RENDER
================================================== */

function render(data) {

  list.innerHTML = "";


  const ngontinh =
    data
      .filter(
        item =>
          item &&
          item.type ===
          "ngontinh"
      )
      .sort(
        (a, b) =>
          b.id - a.id
      );


  ngontinh.forEach(
    item => {

      list.innerHTML += `

        <a
          class="book"
          href="detail.html?id=${item.id}"
        >

          <img
            src="${item.image}"
            alt="${item.title}"
          >

          <div class="view-count">

            Lượt xem:
            <span
              data-view-id="${item.id}"
            >
              0
            </span>

          </div>

          <h2
            class="book-title"
            data-full-title="${String(item.title)
              .replace(/"/g, '&quot;')}"
          >
            ${item.title}
          </h2>

        </a>

      `;

    }
  );


  requestAnimationFrame(() => {

    clampAllBookTitles();

    refreshViewCounts();

  });

}

/* ==================================================
   RESIZE
================================================== */

let resizeTimer;

window.addEventListener(
  "resize",
  function () {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        clampAllBookTitles,
        100
      );

  }
);

</script>
