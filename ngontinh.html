<script>

const list =
  document.getElementById("list");


/* ==================================================
   CẮT TÊN
================================================== */

function clampBookTitle(element) {

  const fullTitle =
    String(
      element.dataset.fullTitle || ""
    ).trim();


  if (!fullTitle) {

    element.textContent = "";

    return;

  }


  element.textContent =
    fullTitle;

  element.style.whiteSpace =
    "normal";

  element.style.overflow =
    "visible";

  element.style.height =
    "auto";

  element.style.maxHeight =
    "none";


  const style =
    window.getComputedStyle(
      element
    );


  const lineHeight =
    parseFloat(
      style.lineHeight
    ) || 21;


  const paddingTop =
    parseFloat(
      style.paddingTop
    ) || 0;


  const paddingBottom =
    parseFloat(
      style.paddingBottom
    ) || 0;


  const maxHeight =
    lineHeight * 2 +
    paddingTop +
    paddingBottom;


  if (
    element.scrollHeight <=
    maxHeight + 1
  ) {

    return;

  }


  const words =
    fullTitle.split(/\s+/);


  let bestText =
    "";


  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const candidate =
      words
        .slice(0, i + 1)
        .join(" ") +
      "...";


    element.textContent =
      candidate;


    if (
      element.scrollHeight <=
      maxHeight + 1
    ) {

      bestText =
        words
          .slice(0, i + 1)
          .join(" ");

    }
    else {

      break;

    }

  }


  if (!bestText) {

    bestText =
      words[0] || "";

  }


  element.textContent =
    bestText + "...";


  element.style.height =
    maxHeight + "px";

  element.style.maxHeight =
    maxHeight + "px";

  element.style.overflow =
    "hidden";

}


/* ==================================================
   TẤT CẢ TÊN
================================================== */

function clampAllBookTitles() {

  document
    .querySelectorAll(".book-title")
    .forEach(element => {

      clampBookTitle(element);

    });

}


/* ==================================================
   VIEW
================================================== */

function refreshViewCounts() {

  if (
    typeof loadViewCounts ===
    "function"
  ) {

    loadViewCounts();

  }

}


/* ==================================================
   RENDER
================================================== */

function render(data) {

  list.innerHTML = "";


  const ngontinh =
    data
      .filter(
        item =>
          item &&
          item.type ===
          "ngontinh"
      )
      .sort(
        (a, b) =>
          b.id - a.id
      );


  ngontinh.forEach(
    item => {

      list.innerHTML += `

        <a
          class="book"
          href="detail.html?id=${item.id}"
        >

          <img
            src="${item.image}"
            alt="${item.title}"
          >

          <div class="view-count">

            

          </div>

          <h2
            class="book-title"
            data-full-title="${String(item.title)
              .replace(/"/g, '&quot;')}"
          >
            ${item.title}
          </h2>

        </a>

      `;

    }
  );


  requestAnimationFrame(() => {

    clampAllBookTitles();

    refreshViewCounts();

  });

}


render(stories);


/* ==================================================
   RESIZE
================================================== */

let resizeTimer;

window.addEventListener(
  "resize",
  function () {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        clampAllBookTitles,
        100
      );

  }
);

</script>



<!-- ==================================================
     POPUP CHUYỂN SANG WEB XÔI THỊT
================================================== -->

<div
  id="xoiThitPopup"
  class="xoi-thit-overlay"
  style="display:none;"
>

  <div class="xoi-thit-box">

      <img
    src="codetruyen/icon.jpg"
    alt="Truyện Mới Miu Miu"
    class="xoi-thit-icon"
  >

  <span class="xoi-thit-arrow">→</span>

  <img
    src="codetruyen/iconxoi.jpg"
    alt="Xôi Thịt Nhà Mui Miu"
    class="xoi-thit-icon"
  >

    <div class="xoi-thit-text">
      Bạn đang chuyển qua web
      <strong>Xôi Thịt Nhà Mui Miu</strong>
    </div>

    <div class="xoi-thit-question">
      Bạn có muốn tiếp tục không?
    </div>

    <div class="xoi-thit-buttons">

      <button
        id="xoiThitYes"
        class="xoi-thit-yes"
      >
        Có
      </button>

      <button
        id="xoiThitNo"
        class="xoi-thit-no"
      >
        Không
      </button>

    </div>

  </div>

</div>


<!-- ==================================================
     POPUP SCRIPT
================================================== -->

<script>

const xoiThitLink =
  document.getElementById("xoiThitLink");

const xoiThitPopup =
  document.getElementById("xoiThitPopup");

const xoiThitYes =
  document.getElementById("xoiThitYes");

const xoiThitNo =
  document.getElementById("xoiThitNo");


/* ==================================================
   ẤN XÔI THỊT
================================================== */

xoiThitLink.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    xoiThitPopup.style.display = "flex";

  }
);


/* ==================================================
   CÓ → CHUYỂN WEB
================================================== */

xoiThitYes.addEventListener(
  "click",
  function() {

    window.location.href =
      "https://truyenxoithitmiumiu.nekoweb.org/";

  }
);


/* ==================================================
   KHÔNG → ĐÓNG BẢNG
================================================== */

xoiThitNo.addEventListener(
  "click",
  function() {

    xoiThitPopup.style.display = "none";

  }
);


/* ==================================================
   ẤN RA NGOÀI BẢNG → ĐÓNG
================================================== */

xoiThitPopup.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      xoiThitPopup
    ) {

      xoiThitPopup.style.display = "none";

    }

  }
);

</script>
